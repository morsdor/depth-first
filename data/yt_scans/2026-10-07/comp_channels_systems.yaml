# COMPUTING-SYSTEMS-MEASURED comp list — written 2026-10-07 to test one hypothesis:
# that "how computing systems behave, shown with measurements and told as verified stories"
# is a lane with >=3x outlier precedent and room for a new channel. A SEPARATE list from
# comp_channels_software.yaml (animated CS explainers) — it overlaps on purpose where a channel
# is a useful baseline.
#
#   python3 scripts/fetch_outliers.py --channels data/comp_channels_systems.yaml --csv data/outliers_systems.csv
#
# ⚠ Handles are best-effort. The script prints a "Channel resolution" table: READ IT. A wrong handle
#   silently tracks the wrong channel. (Kevin Fang is @kevinfaang — double a.)
#
# `lane` is for the analysis join and is ignored by the script:
#   A  failures-as-stories   incident / outage / "what went wrong" — the human or disaster is the hook
#   B  physical-computing    chips, data centres, networks, cables, power — computing you can point at
#   C  trade-offs-with-numbers  system design, latency, scale, cost — judgement with figures
#   D  ml-concepts           CONTROL: animated/visual ML and data-science concept explainers, the lane
#                            the hypothesis says to avoid as an identity
#   F  format-control        non-computing channels whose FORMAT (failure analysis, systems, logistics)
#                            is the precedent being borrowed
channels:
